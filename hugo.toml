baseURL = "https://veganhomecooks.online/"
languageCode = "en-us"
title = "Vegan Home Cooks"
theme = "hugo-cookbook"

[params]
description = "A community recipe book for vegan home cooks"
author = "Vegan Home Cooks Community"

[params.front]
defaultAuthor = "Vegan Home Cooks Community" #Put in the default name of the author of the recipe
defaultImage = "/images/defaultImage.png" #default image that will be used for a recipe with no image
defaultImageHeight = 512 #default recipe image height
defaultImageWidth = 512 # default recipe image width

[params.logo]
fileName = "/images/logo_svg.svg"
height =  50
width = 250

[params.favicon]
fileName = "/images/favicon.png" #your favicon here if you wish to change it.

[menu]
  [[menu.main]]
    name = "Home"
    pre = "fas fa-home" #icon, change if you would prefer a different icon
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Categories" # change to w/e you want, tags or categories works best
    pre = "fas fa-tags" #icon, change if you would prefer a different icon
    url = "/tags/"
    weight = 2
  [[menu.main]]
    name = "Bean Board"
    pre = "fas fa-seedling"
    url = "/bean-board/"
    weight = 3
  [[menu.main]]
    name = "Community Feed"
    pre = "fas fa-comments"
    url = "/community-feed/"
    weight = 4
  [[menu.main]]
    name = "Subscribe"
    pre = "fas fa-rss"
    url = "/index.xml"
    weight = 5

# Print output just creates a special route for a print view
[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS", "JSON"]
  page = ["HTML", "PRINT"]

# The settings for the print format
[outputFormats]
  [outputFormats.PRINT]
    name = "print"
    mediaType = "text/html"
    baseName = "print"
    isPlainText = false
    rel = "print"
    isHTML = true
    noUgly = true
    permalinkable = true
    path = "print"
# Number of items in each RSS feed. -1 means "every page".
[services]
  [services.rss]
    limit = 50

# Allowlist lemmy.world's RSS feed so resources.GetRemote is permitted to fetch it
# at build time (used by the Community Feed page).
[security]
  [security.http]
    urls = ['^https://lemmy\.world/feeds/', '^https://ap\.veganhomecooks\.online/ap/stats$']
